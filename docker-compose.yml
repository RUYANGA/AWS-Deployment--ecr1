# Runs the app exactly as in production: gunicorn, production settings and
# the same image that is pushed to ECR.
#
#   docker compose up --build
#
# Containers read .env as-is and share the host network, so the database
# settings in .env (e.g. POSTGRES_HOST=localhost) work unchanged.

name: logistic

x-app: &app
  image: ${IMAGE_NAME:-logistic-api}:${IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  env_file: .env
  network_mode: host
  # Hardening: immutable filesystem, no privilege escalation, no Linux capabilities.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-off task: applies migrations once, before the web service starts.
  migrate:
    <<: *app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "false"
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "false"  # handled by the migrate service
      SECURE_SSL_REDIRECT: "false"  # no TLS terminator in front locally
    # Listens on the host directly (host network): only reachable from this machine.
    command:
      - gunicorn
      - config.wsgi:application
      - --chdir=src
      - --bind=127.0.0.1:${WEB_PORT:-8000}
      - --workers=3
      - --access-logfile=-
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # X-Forwarded-Proto mirrors what a load balancer sends in production.
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          req = urllib.request.Request('http://127.0.0.1:${WEB_PORT:-8000}/api/v1/health/',
          headers={'X-Forwarded-Proto': 'https'});
          sys.exit(0 if urllib.request.urlopen(req, timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

services:
  web:
    build: .
    env_file: .env
    environment:
      # "localhost" inside a container is the container itself, so reach the
      # host machine's PostgreSQL through host.docker.internal instead.
      POSTGRES_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DJANGO_SETTINGS_MODULE: config.settings.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8000}:8000"

# Base (production-like) stack. Local development tweaks live in
# docker-compose.override.yml, which `docker compose` loads automatically.
#
#   Development:        docker compose up --build
#   Production-like:    docker compose -f docker-compose.yml up --build
#
# PostgreSQL is NOT part of this stack: the containers use the database
# configured in .env, reached on the host machine via host.docker.internal.

name: logistic

x-app-env: &app-env
  # "localhost" inside a container is the container itself.
  POSTGRES_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
  DJANGO_SETTINGS_MODULE: config.settings.prod
  # No TLS terminator in front of the container locally.
  SECURE_SSL_REDIRECT: "false"

x-app: &app
  image: ${IMAGE_NAME:-logistic-api}:${IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # Hardening: immutable filesystem, no privilege escalation, no Linux capabilities.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-off task: applies migrations once, before the web service starts.
  migrate:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"  # handled by the migrate service
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # X-Forwarded-Proto mirrors what a load balancer sends in production.
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          req = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/',
          headers={'X-Forwarded-Proto': 'https'});
          sys.exit(0 if urllib.request.urlopen(req, timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

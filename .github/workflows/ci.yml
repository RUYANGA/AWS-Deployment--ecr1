name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # CI-only values: nothing here is a real secret.
  SECRET_KEY: ci-insecure-secret-key-used-only-for-automated-tests
  POSTGRES_DB: logistic_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (ruff, flake8, bandit, hadolint, shellcheck, Django checks)
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          # Branch protection is enforced by GitHub, not needed on CI checkouts of main.
          SKIP: no-commit-to-branch

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logistic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test apps --settings=config.settings.test --verbosity 2

  docker:
    name: Docker build & smoke test
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logistic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: logistic-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (migrate, start gunicorn, health check)
        run: |
          app_env=(
            -e SECRET_KEY -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
            -e POSTGRES_HOST -e POSTGRES_PORT -e RUN_MIGRATIONS=false
          )
          docker run --rm --network host "${app_env[@]}" logistic-api:ci \
            python manage.py migrate --noinput
          docker run -d --name api --network host "${app_env[@]}" logistic-api:ci

          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/api/v1/health/; then
              echo; echo "Container is healthy"; exit 0
            fi
            sleep 2
          done
          echo "Health check failed" >&2
          docker logs api
          exit 1

      - name: Verify container runs as non-root
        run: test "$(docker run --rm --entrypoint id logistic-api:ci -u)" = "10001"

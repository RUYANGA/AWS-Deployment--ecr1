name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs; never cancel a run on main mid-push to ECR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # CI-only values: nothing here is a real secret.
  SECRET_KEY: ci-insecure-secret-key-used-only-for-automated-tests
  POSTGRES_DB: logistic_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (ruff, flake8, bandit, hadolint, shellcheck, Django checks)
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          # Branch protection is enforced by GitHub, not needed on CI checkouts of main.
          SKIP: no-commit-to-branch

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logistic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test apps --settings=config.settings.test --verbosity 2

  docker:
    name: Docker build & smoke test
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logistic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: logistic-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (migrate, start gunicorn, health check)
        run: |
          app_env=(
            -e SECRET_KEY -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
            -e POSTGRES_HOST -e POSTGRES_PORT -e RUN_MIGRATIONS=false
          )
          docker run --rm --network host "${app_env[@]}" logistic-api:ci \
            python manage.py migrate --noinput
          docker run -d --name api --network host "${app_env[@]}" logistic-api:ci

          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/api/v1/health/; then
              echo; echo "Container is healthy"; exit 0
            fi
            sleep 2
          done
          echo "Health check failed" >&2
          docker logs api
          exit 1

      - name: Verify container runs as non-root
        run: test "$(docker run --rm --entrypoint id logistic-api:ci -u)" = "10001"

  push-ecr:
    name: Push image to ECR
    # Only for code merged to main, and only after lint, tests and the smoke test pass.
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token: write lets GitHub issue the OIDC token used to assume the AWS role
    # (no long-lived access keys); contents: read is all the job needs from the repo.
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REPOSITORY: backend/logistic
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS using OIDC (no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # A commit is pushed only once: re-running the workflow for the same commit skips the
      # build instead of rebuilding and re-tagging (and works with immutable tags as well).
      - name: Check whether this commit is already in ECR
        id: existing
        run: |
          tag=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'images[0].imageId.imageTag' --output text)
          if [ "$tag" = "$GITHUB_SHA" ]; then
            echo "Image for $GITHUB_SHA already exists, skipping push"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.found != 'true'

      - name: Build and push the image
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          # :<commit-sha> identifies the exact build (traceability, rollback);
          # :latest moves to the newest build, so the ECR repo uses MUTABLE tags.
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # One plain image per push instead of an image index + attestation manifests.
          provenance: false
          sbom: false
          # Reuses the BuildKit cache from the smoke-test build.
          cache-from: type=gha

      - name: Summary
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          echo "Image in ECR: $IMAGE"
          echo "### Image in ECR :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

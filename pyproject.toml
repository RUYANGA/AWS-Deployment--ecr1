[project]
name = "logistic-api"
version = "1.0.0"
requires-python = ">=3.12"

# ------------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["src/apps/*/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "DJ",  # flake8-django
    "RUF", # ruff-specific
]
ignore = [
    "RUF012", # mutable class attributes are idiomatic in Django/DRF (Meta.fields, permission_classes)
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"src/config/settings/*.py" = ["F403", "F405"] # star imports between settings modules

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------------- Bandit
[tool.bandit]
exclude_dirs = [".venv", "src/apps/accounts/tests", "src/apps/core/tests"]

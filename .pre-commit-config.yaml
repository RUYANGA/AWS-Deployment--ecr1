# Code quality checks that run automatically on `git commit`.
#
#   Install once:   pip install -r requirements/dev.txt && pre-commit install
#   Run manually:   pre-commit run --all-files
#   Update hooks:   pre-commit autoupdate
default_language_version:
  python: python3.12

exclude: ^(\.venv|staticfiles|media)/

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # Formatting + linting (Black-compatible formatter, isort, pyupgrade, bugbear, Django rules)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Classic flake8 (pycodestyle + pyflakes + mccabe complexity)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        exclude: /migrations/  # generated code

  # Keep Django code on modern APIs for the installed version
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "5.2"]

  # Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -q]
        additional_dependencies: ["bandit[toml]"]
        exclude: /(tests|migrations)/  # test fixtures use dummy passwords

  # Shell scripts and Dockerfile
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  # Django: system checks and no forgotten migrations
  - repo: local
    hooks:
      - id: django-check
        name: django system check
        entry: scripts/django-manage.sh check --fail-level WARNING
        language: system
        pass_filenames: false
        types: [python]
      - id: django-missing-migrations
        name: django missing migrations
        entry: scripts/django-manage.sh makemigrations --check --dry-run
        language: system
        pass_filenames: false
        types: [python]
